name: Request a custom integration quote
description: Request a human-approved price for GitHub automation and evidence verification integration.
title: "[Service request] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Offers: USD $49 indicative starter (one public/synthetic workflow, up to five artifacts) or separately scoped enterprise work; no binding price, purchase or payment by this form. Public submissions only. Do not post secrets, private repository code, customer or payment data. Scope: https://github.com/aymanaseriai-cell/agent-economy-os-2047/blob/main/docs/PILOT_49.md"
  - type: input
    id: public-repository
    attributes:
      label: Public GitHub repository
      description: Optional; leave blank if scope cannot be shared publicly.
      placeholder: https://github.com/OWNER/REPO
    validations:
      required: false
  - type: dropdown
    id: requested-service
    attributes:
      label: What service do you want?
      options:
        - "Starter: buyer-pinned output evidence, indicative 49 USD (public/synthetic only)"
        - "Evaluate agent handoff evidence and buyer acceptance (enterprise audit)"
        - Configure automated agent-evidence integrity checks
        - Add safer GitHub Actions CI automation
        - Review public agent-delivery pipeline
        - Other (describe below)
    validations:
      required: true
  - type: textarea
    id: public-scope
    attributes:
      label: Public, non-sensitive scope
      description: What should a successful result look like?
    validations:
      required: true
