name: TITAN Quantum 90d Recurring Profit Falsification (NO ORDERS)
on:
  push:
    paths:
      - 'trading/titan_quantum_recurrence.py'
      - 'tests/test_titan_quantum_recurrence.py'
      - '.github/workflows/titan-quantum-recurrence-90d.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-public-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit-test forward causality and minimum account risk interlocks
        run: python -m unittest discover -s tests -p 'test_titan_quantum_recurrence.py' -v
      - name: Fetch public OKX 90-day history and fixed contract sizes; no private API or orders
        run: python -m trading.titan_quantum_recurrence --output reports/titan_quantum_recurrence_90d.json --data-dir reports/titan_quantum_recurrence_90d_raw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-quantum-90day-recurrence-no-orders
          path: |
            reports/titan_quantum_recurrence_90d.json
            reports/titan_quantum_recurrence_90d_raw/
          if-no-files-found: warn
          retention-days: 60
