name: TITAN Blind 128% Breakout Public Paper Challenge - NO ORDERS
on:
  push:
    paths:
      - 'trading/titan128_breakout_blind.py'
      - 'tests/test_titan128_breakout_blind.py'
      - '.github/workflows/titan128-breakout-blind.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blind128-public-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run mandatory quantum 3-qubit and classical matched-input integrity gate
        run: python -m trading.titan_quantum_gate --ci --out reports/titan_quantum_ci_gate.json
      - name: Enforce immutable goal, no future leakage, close-only profit accounting
        run: python -m unittest discover -s tests -p 'test_titan128_breakout_blind.py' -v
      - name: Download six deterministic public OKX crypto markets and test fixed 3x/10x paper assumptions
        run: python -m trading.titan128_breakout_blind --out reports/titan128_breakout_blind.json --raw-dir reports/titan128_breakout_raw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan128-blind-breakout-public-data-no-orders
          path: |
            reports/titan128_breakout_blind.json
            reports/titan128_breakout_raw/
          if-no-files-found: warn
          retention-days: 60
