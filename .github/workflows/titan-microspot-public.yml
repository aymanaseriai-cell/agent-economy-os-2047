name: TITAN MicroSpot cash scanner (NO ORDERS)

on:
  workflow_dispatch:
    inputs:
      equity_usdt:
        description: "Research budget in USDT; this is NOT your account balance"
        default: "9"
        required: true
        type: string
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - 'trading/microspot_scout.py'
      - 'tests/test_microspot_scout.py'
      - '.github/workflows/titan-microspot-public.yml'

permissions:
  contents: read

concurrency:
  group: titan-microspot-public-research
  cancel-in-progress: true

jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify risk, cash feasibility and no-order constraints
        run: python -m unittest discover -s tests -p test_microspot_scout.py -v
      - name: Public-only cash-spot scan (NEVER places any orders)
        env:
          RESEARCH_EQUITY: ${{ inputs.equity_usdt || '9' }}
        run: python -m trading.microspot_scout --equity-usdt "$RESEARCH_EQUITY" --max-pairs 25 --output reports/microspot_scout.json
      - name: Store public research report (no credentials, no account data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-microspot-public-only
          path: reports/microspot_scout.json
          retention-days: 2
          if-no-files-found: ignore
