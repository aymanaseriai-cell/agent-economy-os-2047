name: Automatic CTO CI incident reconciliation
on:
  workflow_run:
    workflows: ["Test and verify"]
    types: [completed]
permissions:
  contents: read
  issues: write
concurrency:
  group: ci-incident-main
  cancel-in-progress: false
jobs:
  classify:
    if: >
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Escalate failure or resolve bot-only incidents after current main success
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python automation/ci_incident_router.py
