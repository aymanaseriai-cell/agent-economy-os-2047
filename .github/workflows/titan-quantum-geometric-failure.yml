name: TITAN Quantum Geometric Failure Witness - micro-account real OKX research
on:
  push:
    paths:
      - 'trading/titan_quantum_geometric_failure.py'
      - 'tests/test_titan_quantum_geometric_failure.py'
      - '.github/workflows/titan-quantum-geometric-failure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-historical-public-research-no-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify unitary 2-qubit embedding, causal signals, zero future data
        run: python -m unittest discover -s tests -p 'test_titan_quantum_geometric_failure.py' -v
      - name: Six new public OKX crypto markets, 60d, 4.15 USDT micro paper and stress, NO ORDERS
        run: python -m trading.titan_quantum_geometric_failure --out reports/titan_qgfw_micro_real_history.json --raw-dir reports/titan_qgfw_public_raw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-qgfw-real-public-candles-after-cost-report
          path: |
            reports/titan_qgfw_micro_real_history.json
            reports/titan_qgfw_public_raw/
          if-no-files-found: warn
          retention-days: 60
