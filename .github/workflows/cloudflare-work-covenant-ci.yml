name: Cloudflare Work Covenant failover checks
on:
  push:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-work-covenant-ci.yml'
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-work-covenant-ci.yml'
permissions:
  contents: read
jobs:
  cloudflare-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cloudflare/worker.test.mjs
