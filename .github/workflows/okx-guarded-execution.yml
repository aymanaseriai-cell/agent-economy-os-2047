name: OKX guarded execution (LIVE only after explicit arm)
on:
  workflow_dispatch:
    inputs:
      purpose:
        description: 'Validate credentials, scan public research only, or explicitly authorized live run'
        type: choice
        options:
          - validate
          - research
          - run
        default: validate
        required: true
      confirm_live:
        description: 'I explicitly authorize this live run, including real-money loss risk'
        type: boolean
        default: false
        required: true
      continuous:
        description: 'Chain the next session 20 seconds after a clean bounded session'
        type: boolean
        default: false
        required: true
      confirm_continuous_live:
        description: 'I authorize repeated live sessions and understand cumulative loss risk'
        type: boolean
        default: false
        required: true
      resume_after_exit:
        description: 'After a PROTECTED fill, monitor OKX and seek a fresh trade >=10m after full exit (guarded/adaptive_guarded/full_margin)'
        type: boolean
        default: false
        required: true
      confirm_repeat_entries:
        description: 'I authorize recurring entries with NO fixed daily count; full_margin can liquidate my account'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
  actions: write
concurrency:
  group: okx-guarded-execution-account
  cancel-in-progress: false
jobs:
  execution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate API connection without trading
        if: inputs.purpose == 'validate'
        run: python -m trading.okx_live_executor --verify-only
        env:
          OKX_EXECUTION_MODE: ${{ vars.OKX_EXECUTION_MODE || 'dry_run' }}
          OKX_ENABLE_REAL_TRADING: ${{ vars.OKX_ENABLE_REAL_TRADING || 'NO' }}
          OKX_STOP_CONTINUOUS: ${{ vars.OKX_STOP_CONTINUOUS || 'YES' }}
          OKX_REQUIRE_OMEGA: 'YES'
          OKX_EXECUTION_ARM: ${{ secrets.OKX_EXECUTION_ARM }}
          OKX_CAPITAL_MODE: ${{ vars.OKX_CAPITAL_MODE || 'guarded' }}
          OKX_MAX_ACTIVE_POSITIONS: ${{ vars.OKX_MAX_ACTIVE_POSITIONS || '1' }}
          OKX_PORTFOLIO_ARM: ${{ vars.OKX_PORTFOLIO_ARM || 'NO' }}
          OKX_FULL_MARGIN_ARM: ${{ secrets.OKX_FULL_MARGIN_ARM }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_API_DOMAIN: ${{ vars.OKX_API_DOMAIN || 'https://www.okx.com' }}
      - name: Research-only TITAN Omega scan (NO OKX orders)
        if: inputs.purpose == 'research'
        run: |
          set -euo pipefail
          python -m trading.okx_run_policy --purpose research
          python -m trading.okx_five_second_worker --interval-seconds 5 --top 6 --max-runtime-seconds 245 --graceful-public-deadline --report reports/okx_six_agents.json
        env:
          OKX_EXECUTION_MODE: dry_run
          OKX_ENABLE_REAL_TRADING: 'NO'
          OKX_STOP_CONTINUOUS: 'YES'
          OKX_AUTOREENTRY_ENABLED: 'NO'
          OKX_REQUIRE_OMEGA: 'YES'
      - name: Preflight owner stop switches before LIVE worker starts
        if: inputs.purpose == 'run'
        run: python -m trading.okx_run_policy --purpose run
        env:
          OKX_EXECUTION_MODE: ${{ vars.OKX_EXECUTION_MODE || 'dry_run' }}
          OKX_ENABLE_REAL_TRADING: ${{ vars.OKX_ENABLE_REAL_TRADING || 'NO' }}
          OKX_STOP_CONTINUOUS: ${{ vars.OKX_STOP_CONTINUOUS || 'YES' }}
      - name: Refuse unconfirmed live run (never mark skipped execution green)
        if: inputs.purpose == 'run' && inputs.confirm_live != true
        run: |
          echo "::error::LIVE TRADING NOT STARTED. Choose purpose=run and check confirm_live=true."
          exit 1
      - name: Refuse unconfirmed recurring live execution
        if: inputs.purpose == 'run' && inputs.resume_after_exit == true
        env:
          CONTINUOUS: ${{ inputs.continuous }}
          CONTINUOUS_CONFIRM: ${{ inputs.confirm_continuous_live }}
          REPEAT_CONFIRM: ${{ inputs.confirm_repeat_entries }}
        run: |
          if [[ "$CONTINUOUS" != "true" || "$CONTINUOUS_CONFIRM" != "true" || "$REPEAT_CONFIRM" != "true" ]]; then
            echo "::error::Recurring entries require all independent confirmations."
            exit 1
          fi
          # Explicit full-margin arming remains mandatory within check_mode
          # before any private execution path can submit an OKX order.
      - name: Five-second continuous worker within bounded GitHub job
        id: worker
        if: inputs.purpose == 'run' && inputs.confirm_live == true
        run: |
          set -euo pipefail
          extra_args=()
          if [[ "$OKX_AUTOREENTRY_ENABLED" == 'YES' ]]; then
            extra_args+=(--resume-after-protected-fill)
          fi
          python -m trading.okx_five_second_worker --interval-seconds 5 --max-runtime-seconds 245 --report reports/okx_six_agents.json "${extra_args[@]}" | tee "$RUNNER_TEMP/okx_worker.log"
        env:
          OKX_EXECUTION_MODE: ${{ vars.OKX_EXECUTION_MODE || 'dry_run' }}
          OKX_ENABLE_REAL_TRADING: ${{ vars.OKX_ENABLE_REAL_TRADING || 'NO' }}
          OKX_STOP_CONTINUOUS: ${{ vars.OKX_STOP_CONTINUOUS || 'YES' }}
          OKX_REQUIRE_OMEGA: 'YES'
          OKX_EXECUTION_ARM: ${{ secrets.OKX_EXECUTION_ARM }}
          OKX_CAPITAL_MODE: ${{ vars.OKX_CAPITAL_MODE || 'guarded' }}
          OKX_MAX_ACTIVE_POSITIONS: ${{ vars.OKX_MAX_ACTIVE_POSITIONS || '1' }}
          OKX_PORTFOLIO_ARM: ${{ vars.OKX_PORTFOLIO_ARM || 'NO' }}
          OKX_AUTOREENTRY_ENABLED: ${{ inputs.resume_after_exit && inputs.confirm_repeat_entries && inputs.continuous && inputs.confirm_continuous_live && 'YES' || 'NO' }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          OKX_FULL_MARGIN_ARM: ${{ secrets.OKX_FULL_MARGIN_ARM }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_API_DOMAIN: ${{ vars.OKX_API_DOMAIN || 'https://www.okx.com' }}
      - name: Record public research evidence only (never private account/order data)
        if: (inputs.purpose == 'run' || inputs.purpose == 'research') && always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-signal-research-only
          path: reports/okx_six_agents.json
          retention-days: 3
          if-no-files-found: ignore
      - name: Chain another session after 20 seconds (clean bounded exit only)
        if: >-
          ${{ inputs.purpose == 'run' && inputs.confirm_live == true && inputs.continuous == true && inputs.confirm_continuous_live == true && steps.worker.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OKX_STOP_CONTINUOUS: ${{ vars.OKX_STOP_CONTINUOUS || 'NO' }}
          RESUME_AFTER_EXIT: ${{ inputs.resume_after_exit }}
          OKX_ENABLE_REAL_TRADING: ${{ vars.OKX_ENABLE_REAL_TRADING || 'NO' }}
          CONFIRM_REPEAT_ENTRIES: ${{ inputs.confirm_repeat_entries }}
        run: |
          set -euo pipefail
          if [[ "$OKX_STOP_CONTINUOUS" == 'YES' || "$OKX_ENABLE_REAL_TRADING" != 'YES' ]]; then
            echo 'Continuous mode stopped by stop switch / disabled live trading'
            exit 0
          fi
          if ! tail -n 1 "$RUNNER_TEMP/okx_worker.log" | grep -Eq '^TITAN bounded runtime reached(; no new market scan started)?$'; then
            echo 'Worker ended early after order or an uncertain state; no blind automatic replay.'
            exit 0
          fi
          echo 'Clean session complete. Waiting 20 seconds before requesting the next run.'
          sleep 20
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/okx-guarded-execution.yml/dispatches" \
            -f ref="$GITHUB_REF_NAME" \
            -f 'inputs[purpose]=run' \
            -f 'inputs[confirm_live]=true' \
            -f 'inputs[continuous]=true' \
            -f 'inputs[confirm_continuous_live]=true' \
            -f "inputs[resume_after_exit]=${RESUME_AFTER_EXIT}" \
            -f "inputs[confirm_repeat_entries]=${CONFIRM_REPEAT_ENTRIES}"
