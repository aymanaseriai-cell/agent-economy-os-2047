name: OKX guarded execution (LIVE only after explicit arm)
on:
  workflow_dispatch:
    inputs:
      purpose:
        description: 'Read-only credential validation or explicitly authorized live run'
        type: choice
        options:
          - validate
          - run
        default: validate
        required: true
      confirm_live:
        description: 'I explicitly authorize this ONE manual live run, including real-money loss risk'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: okx-guarded-execution-account
  cancel-in-progress: false
jobs:
  execution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate API connection without trading
        if: inputs.purpose == 'validate'
        run: python -m trading.okx_live_executor --verify-only
        env:
          OKX_EXECUTION_MODE: ${{ vars.OKX_EXECUTION_MODE || 'dry_run' }}
          OKX_ENABLE_REAL_TRADING: ${{ vars.OKX_ENABLE_REAL_TRADING || 'NO' }}
          OKX_EXECUTION_ARM: ${{ secrets.OKX_EXECUTION_ARM }}
          OKX_CAPITAL_MODE: ${{ vars.OKX_CAPITAL_MODE || 'guarded' }}
          OKX_FULL_MARGIN_ARM: ${{ secrets.OKX_FULL_MARGIN_ARM }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_API_DOMAIN: ${{ vars.OKX_API_DOMAIN || 'https://www.okx.com' }}
      - name: Refuse unconfirmed live run (never mark skipped execution green)
        if: inputs.purpose == 'run' && inputs.confirm_live != true
        run: |
          echo "::error::LIVE TRADING NOT STARTED. Choose purpose=run and check confirm_live=true."
          exit 1
      - name: Five-second continuous worker within bounded GitHub job
        if: inputs.purpose == 'run' && inputs.confirm_live == true
        run: python -m trading.okx_five_second_worker --interval-seconds 5 --max-runtime-seconds 245 --report reports/okx_six_agents.json
        env:
          OKX_EXECUTION_MODE: ${{ vars.OKX_EXECUTION_MODE || 'dry_run' }}
          OKX_ENABLE_REAL_TRADING: ${{ vars.OKX_ENABLE_REAL_TRADING || 'NO' }}
          OKX_EXECUTION_ARM: ${{ secrets.OKX_EXECUTION_ARM }}
          OKX_CAPITAL_MODE: ${{ vars.OKX_CAPITAL_MODE || 'guarded' }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          OKX_FULL_MARGIN_ARM: ${{ secrets.OKX_FULL_MARGIN_ARM }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_API_DOMAIN: ${{ vars.OKX_API_DOMAIN || 'https://www.okx.com' }}
      - name: Record public research evidence only (never private account/order data)
        if: inputs.purpose == 'run' && inputs.confirm_live == true && always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-signal-research-only
          path: reports/okx_six_agents.json
          retention-days: 3
          if-no-files-found: ignore
