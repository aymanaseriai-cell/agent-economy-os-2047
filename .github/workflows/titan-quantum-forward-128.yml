name: TITAN Quantum 128 Frozen Forward Research - NO ORDERS
on:
  push:
    paths:
      - 'trading/titan_quantum_forward_128.py'
      - 'tests/test_titan_quantum_forward_128.py'
      - '.github/workflows/titan-quantum-forward-128.yml'
  workflow_dispatch:
    inputs:
      phase:
        description: 'Capture future predictions or score a prior immutable snapshot'
        type: choice
        required: true
        options: [capture, score]
        default: capture
      capture_run_id:
        description: 'Prior GitHub run ID containing sealed capture, for score only'
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: titan-qf128-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  prospective-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test frozen chronology, same-input quantum comparator, fees, and seal hash
        run: python -m unittest discover -s tests -p 'test_titan_quantum_forward_128.py' -v
      - name: Verify 3-qubit quantum mathematical integrity, no orders
        run: python -m trading.titan_quantum_gate --ci --out reports/qf128_math_audit.json
      - name: Seal future 1h / 4h predictions before any future entry
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.phase == 'capture') }}
        run: python -m trading.titan_quantum_forward_128 capture --out reports/qf128_sealed.json
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.phase == 'capture') }}
        with:
          name: titan-qf128-sealed-prospective-public-data
          path: reports/qf128_sealed.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify user-specified prior capture run ID
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.phase == 'score' }}
        env:
          SOURCE_RUN: ${{ inputs.capture_run_id }}
        run: |
          if ! [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]; then
            echo "::error::Specify a previous numeric capture_run_id"
            exit 2
          fi
      - uses: actions/download-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.phase == 'score' }}
        with:
          name: titan-qf128-sealed-prospective-public-data
          run-id: ${{ inputs.capture_run_id }}
          github-token: ${{ github.token }}
          path: reports/qf128_prior
      - name: Score only matured future market prices, never recompute frozen signals
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.phase == 'score' }}
        run: python -m trading.titan_quantum_forward_128 score --sealed reports/qf128_prior/qf128_sealed.json --out reports/qf128_scored.json
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.phase == 'score' }}
        with:
          name: titan-qf128-matured-paper-score
          path: reports/qf128_scored.json
          if-no-files-found: error
          retention-days: 90
