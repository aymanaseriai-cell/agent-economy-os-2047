name: Agent Work Covenant | deterministic proof tests
on:
  workflow_dispatch:
  push:
    paths:
      - "services/agent-work-covenant-2047/**"
      - "tests/work_covenant/**"
      - "examples/proof-carrying-work/**"
      - ".github/workflows/work-covenant-ci.yml"
  pull_request:
    paths:
      - "services/agent-work-covenant-2047/**"
      - "tests/work_covenant/**"
      - "examples/proof-carrying-work/**"
      - ".github/workflows/work-covenant-ci.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Unit and negative-path tests
        run: node --test tests/work_covenant/*.mjs
      - name: One-command offline demo
        run: |
          node examples/proof-carrying-work/run.mjs > /tmp/agent-work-demo.json
          node -e "const r=require('/tmp/agent-work-demo.json'); if(r.valid.status!=='local_checks_passed'||r.tampered.status!=='local_checks_failed'||r.payment_verified!==false||r.buyer_acceptance_verified!==false) process.exit(1)"
