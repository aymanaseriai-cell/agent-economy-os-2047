name: TITAN MicroSpot / CASH SPOT (explicitly armed)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Verify account (no orders) or submit ONE real cash-spot entry + OCO'
        type: choice
        options: [verify, live]
        required: true
        default: verify
      confirm_real_money_loss:
        description: 'I authorize a real SPOT order and accept potential loss of all invested USDT'
        type: boolean
        required: true
        default: false
  # No scheduled real orders without separate approval and deployment.
permissions:
  contents: read
concurrency:
  group: titan-microspot-account
  cancel-in-progress: false
jobs:
  guarded-spot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Unit tests with NO network/orders
        run: python -m unittest discover -s tests -p test_microspot_*.py -v
      - name: Reject unconfirmed real-money mode
        if: ${{ inputs.mode == 'live' && inputs.confirm_real_money_loss != true }}
        run: exit 1
      - name: Run isolated OKX cash Spot verification or explicitly armed trade
        if: ${{ inputs.mode == 'verify' || inputs.confirm_real_money_loss == true }}
        run: python -m trading.okx_spot_live --mode "${MODE}"
        env:
          MODE: ${{ inputs.mode }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_API_DOMAIN: https://www.okx.com
          OKX_EXECUTION_MODE: ${{ inputs.mode == 'live' && 'live' || 'verify' }}
          OKX_ENABLE_REAL_TRADING: ${{ inputs.mode == 'live' && inputs.confirm_real_money_loss && 'YES' || 'NO' }}
          OKX_SPOT_LIVE_ARM: ${{ inputs.mode == 'live' && inputs.confirm_real_money_loss && 'I_AUTHORIZE_REAL_CASH_SPOT_LOSS' || 'NO' }}
