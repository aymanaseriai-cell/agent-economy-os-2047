name: Portable agent skill — offline marketplace packaging
on:
  pull_request:
    paths:
      - 'distribution/agensi/**'
      - 'buyer-gate/check.py'
      - 'examples/buyer-gate/**'
      - 'tests/test_marketplace_skill_package.py'
      - '.github/workflows/marketplace-skill-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-buyer-skill-review
  cancel-in-progress: false
jobs:
  build-offline-skill:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit-test packaged standalone Python skill and negative cases
        run: python3 -m unittest discover -s tests -p 'test_marketplace_skill_package.py' -v
      - name: Produce reproducible review-only ZIP
        run: python3 distribution/agensi/build_skill.py
      - name: Upload release-candidate artifact, not a live marketplace listing
        uses: actions/upload-artifact@v4
        with:
          name: buyer-acceptance-skill-review-only
          path: dist/agent-economy-buyer-acceptance-0.1.0.zip
          retention-days: 14
          if-no-files-found: error
