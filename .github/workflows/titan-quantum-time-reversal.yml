name: TITAN Quantum Time-Reversal 4.15->8.30 crypto research (NO ORDERS)
on:
  push:
    paths:
      - 'trading/titan_quantum_time_reversal.py'
      - 'tests/test_titan_quantum_time_reversal.py'
      - '.github/workflows/titan-quantum-time-reversal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-orders-public-research:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test physical two-qubit circuit and causal time arrow
        run: python -m unittest discover -s tests -p 'test_titan_quantum_time_reversal.py' -v
      - name: Get new public OKX crypto candles, fixed-time 60/20/20 real 4.15 USDT paper experiment
        run: python -m trading.titan_quantum_time_reversal --out reports/titan_qtrw_real_crypto_micro.json --raw-dir reports/titan_qtrw_raw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-qtrw-audited-real-public-crypto-no-orders
          path: |
            reports/titan_qtrw_real_crypto_micro.json
            reports/titan_qtrw_raw/
          if-no-files-found: warn
          retention-days: 60
