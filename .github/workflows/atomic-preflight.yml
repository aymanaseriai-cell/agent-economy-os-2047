name: Atomic Agent Trust Preflight tests
on:
  pull_request:
    paths: ['agent_trust_preflight/**', '.github/workflows/atomic-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s agent_trust_preflight/tests -v
