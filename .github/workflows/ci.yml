name: Test and verify
on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests (including quantum mathematical and evidence guards)
        run: python -m unittest discover -s tests -v
      - name: Quantum research gate, identical-input classical control (NO ORDERS)
        run: python -m trading.titan_quantum_gate --ci --out reports/titan_quantum_ci_gate.json
      - name: Verify sample agent evidence
        run: python verifier.py evidence-manifest.json --root . --json-out evidence-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-check-result
          path: |
            evidence-report.json
            reports/titan_quantum_ci_gate.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Build standalone marketplace ZIP (feature branch only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/portable-buyer-gate-marketplace-20261122' }}
        run: python3 distribution/agensi/build_skill.py --out dist/agent-economy-buyer-acceptance-0.1.0.zip
      - name: Upload standalone marketplace ZIP for review only
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/portable-buyer-gate-marketplace-20261122' }}
        uses: actions/upload-artifact@v4
        with:
          name: portable-buyer-acceptance-review-zip
          path: dist/agent-economy-buyer-acceptance-0.1.0.zip
          retention-days: 14
          if-no-files-found: error
