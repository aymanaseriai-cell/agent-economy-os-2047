name: TITAN 2037 5-second worker proof (PUBLIC RESEARCH ONLY)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: titan-five-second-proof
  cancel-in-progress: true
jobs:
  heartbeat-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OKX_EXECUTION_MODE: dry_run
      OKX_ENABLE_REAL_TRADING: NO
      OKX_CAPITAL_MODE: guarded
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run nine deterministic cadence and trade-safety tests
        run: python -m unittest discover -s tests -p 'test_okx_five_second_worker.py' -v
      - name: Prove consecutive 5-second pauses on public OKX council scans
        run: python -m trading.okx_five_second_worker --interval-seconds 5 --max-cycles 3 --max-runtime-seconds 235 --top 6 --report reports/titan_5s_public.json
      - name: Archive PUBLIC market evidence (no private orders or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-5-second-cadence-research
          path: reports/titan_5s_public.json
          if-no-files-found: warn
          retention-days: 7
