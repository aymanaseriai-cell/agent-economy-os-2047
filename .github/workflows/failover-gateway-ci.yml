name: Read-only API failover gateway tests
on:
  push:
    paths:
      - 'gateway/**'
      - '.github/workflows/failover-gateway-ci.yml'
  pull_request:
    paths:
      - 'gateway/**'
      - '.github/workflows/failover-gateway-ci.yml'
permissions:
  contents: read
jobs:
  node-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test gateway/worker.test.mjs
