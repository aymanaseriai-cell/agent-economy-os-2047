name: TITAN blind real OKX historical 45-day trial NO ORDERS
on:
  push:
    paths:
      - 'trading/titan_unseen_45d.py'
      - 'tests/test_titan_unseen_45d.py'
      - '.github/workflows/titan-unseen-historical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify precommitted new-strategy integrity (NO API KEYS)
        run: python -m unittest discover -s tests -p 'test_titan_unseen_45d.py' -v
      - name: Public OKX real 15-minute candles, six NEVER-BEFORE-TESTED markets
        run: python -m trading.titan_unseen_45d --output reports/titan_unseen_45d_result.json --data-dir reports/titan_unseen_45d_data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-45day-real-unseen-six-markets-research
          path: |
            reports/titan_unseen_45d_result.json
            reports/titan_unseen_45d_data/
          if-no-files-found: warn
          retention-days: 60
