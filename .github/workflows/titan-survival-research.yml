name: TITAN SURVIVAL-8 + PORTFOLIO 2037 (research only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-research:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test eight-agent research
        run: python -m unittest discover -s tests -p test_titan_survival_council.py -v
      - name: Test 10x-100x hypothetical portfolios
        run: python -m unittest discover -s tests -p test_titan_portfolio_2037.py -v
      - name: Verify no-order research gate
        env:
          OKX_EXECUTION_MODE: dry_run
          OKX_ENABLE_REAL_TRADING: 'NO'
          OKX_STOP_CONTINUOUS: 'YES'
        run: python -m trading.okx_run_policy --purpose research
      - name: Public scan, with NO private OKX access
        env:
          OKX_EXECUTION_MODE: dry_run
          OKX_ENABLE_REAL_TRADING: 'NO'
          OKX_STOP_CONTINUOUS: 'YES'
          OKX_AUTOREENTRY_ENABLED: 'NO'
          OKX_REQUIRE_OMEGA: 'YES'
        run: python -m trading.six_agent_council --top 20 --all-eligible --out reports/okx_six_agents.json
      - name: SURVIVAL-8 risk analysis
        run: python -m trading.titan_survival_council --report reports/okx_six_agents.json --out reports/titan_survival_eight.json --summary "$GITHUB_STEP_SUMMARY"
      - name: 10x-100x multiple-position full-margin STRESS ONLY
        run: python -m trading.titan_portfolio_2037 --report reports/okx_six_agents.json --out reports/titan_portfolio_2037.json --margin-share 1.0 --max-positions 5 --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-2037-public-no-orders
          path: |
            reports/titan_survival_eight.json
            reports/titan_portfolio_2037.json
          retention-days: 7
          if-no-files-found: ignore
